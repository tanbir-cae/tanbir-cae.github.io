<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stressMap" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#0b1120"/>
  <rect x="80" y="90" width="580" height="290" rx="6" fill="url(#stressMap)" opacity="0.85"/>

  <g stroke="rgba(255,255,255,0.25)" stroke-width="1">
    <line x1="80" y1="90" x2="220" y2="200"/><line x1="220" y1="200" x2="380" y2="90"/>
    <line x1="380" y1="90" x2="500" y2="220"/><line x1="500" y1="220" x2="660" y2="90"/>
    <line x1="80" y1="380" x2="220" y2="200"/><line x1="220" y1="200" x2="380" y2="380"/>
    <line x1="380" y1="380" x2="500" y2="220"/><line x1="500" y1="220" x2="660" y2="380"/>
  </g>

  <rect x="680" y="90" width="22" height="290" fill="url(#stressMap)" stroke="#64748b" stroke-width="1"/>
  <text x="710" y="105" fill="#ef4444" font-family="monospace" font-size="11">242.8 MPa (Max)</text>
  <text x="710" y="175" fill="#f59e0b" font-family="monospace" font-size="11">182.1 MPa</text>
  <text x="710" y="245" fill="#10b981" font-family="monospace" font-size="11">121.4 MPa</text>
  <text x="710" y="315" fill="#0284c7" font-family="monospace" font-size="11">60.7 MPa</text>
  <text x="710" y="380" fill="#3b82f6" font-family="monospace" font-size="11">0.0 MPa</text>

  <text x="80" y="55" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">VON MISES EQUIVALENT STRESS CONTOUR [MPa]</text>
